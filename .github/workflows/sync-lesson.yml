# M1~M6 부분(a1/, examples/)이 바뀌어 main 에 들어오면 볼앤빔 교재 저장소(ball-and-beam)의
# app/smars-lesson/a1/, examples/ 에도 반영한다(볼앤빔 a1장 "아두이노 기초와 사용법"). lesson.html(틀·M0·M7·정리)은 동기화하지 않는다.
# 반대 방향은 ball-and-beam 의 .github/workflows/sync-lesson.yml 이 한다. 두 쪽 모두 tools/sync_lesson.mjs 를 쓴다.
#
# 한 번만 필요한 설정(사용자):
#   fine-grained 토큰 하나를 만든다 — 저장소: kgh-DaC/ball-and-beam, kgh-DaC/lecture-SMARS / 권한: Contents: Read and write.
#   두 저장소 모두 Settings → Secrets and variables → Actions 에 `LESSON_SYNC_TOKEN` 이름으로 넣는다.
# 서로 밀어 넣어도 두 번째 실행은 바뀐 것이 없어 커밋하지 않으므로 반복되지 않는다.
# 양쪽이 다르게 바뀌었으면(충돌) 아무것도 쓰지 않고 실패한다 → 로컬에서 node tools/sync_lesson.mjs --prefer smars|bb 로 정리.
name: Sync lesson to ball-and-beam
on:
  push:
    branches: [main]
    paths:
      - 'a1/**'
      - 'examples/**'
      - 'tools/sync_lesson.mjs'
      - 'tools/sync_lesson.state.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-lesson
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 토큰 설정 확인(없으면 건너뜀)
        id: tok
        env:
          TOKEN: ${{ secrets.LESSON_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::LESSON_SYNC_TOKEN 시크릿이 없어 자동 동기화를 건너뜁니다. 로컬에서 node tools/sync_lesson.mjs 를 쓰거나, 이 파일 머리의 '한 번만 필요한 설정'을 따라 토큰을 넣어 주세요."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok == 'true'
        with:
          token: ${{ secrets.LESSON_SYNC_TOKEN }}
      - uses: actions/setup-node@v4
        if: steps.tok.outputs.ok == 'true'
        with:
          node-version: 22
      - name: 볼앤빔 저장소 내려받기
        if: steps.tok.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.LESSON_SYNC_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/kgh-DaC/ball-and-beam.git" _bb
      - name: 동기화
        if: steps.tok.outputs.ok == 'true'
        run: node tools/sync_lesson.mjs --other _bb
      - name: 양쪽 커밋·푸시(바뀐 것이 있을 때만)
        if: steps.tok.outputs.ok == 'true'
        run: |
          set -e
          msg="교재 동기화: SMARS ${GITHUB_SHA::7} → 볼앤빔 a1장(app/smars-lesson)"
          for d in _bb .; do
            ( cd "$d"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              if [ "$d" = "." ]; then git add a1 examples tools/sync_lesson.mjs tools/sync_lesson.state.json; else git add app/smars-lesson/a1 app/smars-lesson/examples tools/sync_lesson.mjs tools/sync_lesson.state.json; fi
              if git diff --cached --quiet; then echo "$d: 바뀐 것 없음"; else git commit -m "$msg" && git push; fi )
          done
